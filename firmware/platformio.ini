; Status light firmware: Seeed XIAO ESP32-C3 + 12-LED NeoPixel ring.
; Two choices per light, one build for each combination:
;   ring:        rgb  (e.g. Adafruit 1643)  |  rgbw (Adafruit 2851/2852/2853)
;   connection:  wifi (talks to the hub; for sessions on another machine, e.g. charon)
;                usb  (radio off; driven over USB by the computer running Claude Code)
; See docs/setup.md, "Choosing how a light connects".
;
; Build on charon (or any machine with PlatformIO), flash from the browser: see firmware/README.md.
;   pio run                      build all four
;   python3 tools/make_image.py  turn the builds into .bin files for the browser flasher
; Or flash directly from a machine the XIAO is plugged into:
;   pio run -e xiao_rgbw_usb -t upload

[platformio]
default_envs = xiao_rgb_wifi, xiao_rgbw_wifi, xiao_rgb_usb, xiao_rgbw_usb

[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; Two 1.9 MB app slots: room for Wi-Fi + HTTPS + the setup screen, and for updates over Wi-Fi later.
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    tzapu/WiFiManager@^2.0.17

[env:xiao_rgb_wifi]
build_flags = -DRGBW=0 -DUSE_WIFI=1

[env:xiao_rgbw_wifi]
build_flags = -DRGBW=1 -DUSE_WIFI=1

[env:xiao_rgb_usb]
build_flags = -DRGBW=0 -DUSE_WIFI=0

[env:xiao_rgbw_usb]
build_flags = -DRGBW=1 -DUSE_WIFI=0
