; Command-line build/flash alternative to the Arduino IDE.
;   cd firmware && pio run            (compile both)
;   cd firmware && pio run -e flora -t upload  (flash RGB ring; double-tap Flora reset if upload can't find it)
[platformio]
src_dir = flora_status_light

[env:flora]
platform = atmelavr
board = flora8
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
build_flags = -DRGBW=0

; RGBW ring: pio run -e flora_rgbw -t upload
[env:flora_rgbw]
extends = env:flora
build_flags = -DRGBW=1
