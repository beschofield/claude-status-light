; Command-line build/flash alternative to the Arduino IDE.
;   cd firmware && pio run            (compile)
;   cd firmware && pio run -t upload  (flash; double-tap Flora reset if upload can't find it)
[platformio]
src_dir = flora_status_light

[env:flora]
platform = atmelavr
board = flora8
framework = arduino
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
